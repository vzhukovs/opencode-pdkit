# A tag v<version> on a commit of main publishes that version to npm, once CI
# has passed on the commit. RELEASING.md is the runbook around it.
#
# npm trusts this file by its name: the package's trusted publisher on
# npmjs.com names `publish.yml` in this repository. Renamed, it publishes
# nothing until the setting is changed with it.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    # Everything the publish job must not find out from npm, in a job that
    # holds no token that could publish.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.registry.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # First, because nothing else catches it. npm publishes the version
      # package.json carries, whatever the tag says, and test/release.test.js
      # holds the changelog to package.json but cannot see a tag. A v0.17.0 on
      # a commit that still says 0.16.1 would publish 0.16.1 under it, or be
      # refused as a republish, and either way the tag would name a release
      # that does not exist.
      - name: The tag is the version package.json carries
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME and package.json says $version, which is what npm would publish. Tag v$version, or bump package.json first"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is package.json's version"

      # The tag goes on a commit only after CI has passed on it; this reads
      # CI's record of that and does not run the checks again. The run is the
      # one of a push to main, so the commit is one main has. Every job must
      # have passed, but for two kinds:
      #   - the `latest` legs are signals of what a newer Open Code changed, and
      #     a release is not made on them (they are listed, never block);
      #   - receipt-gate is skipped when the run had no provider key: then it
      #     did not run, which is not a pass, and RELEASING.md has the check run
      #     by hand before the tag. It is a warning here, since a hand-run check
      #     leaves nothing this job could read.
      # The minimum legs pass `continue-on-error` while they gather a record,
      # so a red one leaves the run green: the release reads each job, not the
      # run. Each job named below must be there.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 1 --json databaseId,status --jq '.[] | "\(.databaseId) \(.status)"')"
          if [ -z "$run" ]; then
            echo "::error::no ci run for a push to main at $GITHUB_SHA: tag a commit of main, once CI has run on it"
            exit 1
          fi
          read -r id status <<<"$run"
          if [ "$status" != completed ]; then
            echo "::error::ci run $id on this commit is $status: let it finish, then re-run this workflow"
            exit 1
          fi

          jobs="$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv')"
          failed=0
          receipt=0
          {
            echo "### CI on $GITHUB_SHA"
            echo
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r name conclusion; do
            case "$name" in
              *'(latest'*)
                verdict="signal" ;;
              receipt-gate | 'receipt-gate (minimum'*)
                receipt=1
                case "$conclusion" in
                  success) verdict="ok" ;;
                  skipped)
                    verdict="skipped: not run, not passed"
                    echo "::warning title=receipt-gate skipped::the receipt gate was not checked on this commit (no provider key in the run). RELEASING.md has it checked by hand before the tag: this run cannot tell whether it was" ;;
                  *) verdict="FAIL"; failed=1 ;;
                esac ;;
              *)
                if [ "$conclusion" = success ]; then verdict="ok"; else verdict="FAIL"; failed=1; fi ;;
            esac
            printf '%-40s %-10s %s\n' "$name" "$conclusion" "$verdict"
            echo "- \`$name\`: $conclusion ($verdict)" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$jobs"

          for required in 'test (ubuntu-latest)' 'test (macos-latest)' 'test (windows-latest)' \
            'plugin-load (minimum' 'receipt-gate-key'; do
            if ! grep -qF -- "$required" <<<"$jobs"; then
              echo "::error::ci run $id has no job named ${required}…: a release is made on it. If ci.yml renamed it, rename it here too"
              failed=1
            fi
          done
          if [ "$receipt" -eq 0 ]; then
            echo "::error::ci run $id has no receipt-gate job for the minimum Open Code"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::CI did not pass on $GITHUB_SHA (run $id), so nothing is published: RELEASING.md, 'When the publish workflow stops', says what next"
            exit 1
          fi

      # npm never publishes over a version it has, so a run for a version that
      # is already there could only fail. That is the case of the first
      # release, which is published by hand before the tag goes up (npm takes
      # a trusted publisher only for a package that exists), and of this
      # workflow re-run after a publish that went through. The publish job is
      # then skipped, and shown as skipped.
      - id: registry
        name: Is this version on npm already
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if out="$(npm view "$name@$version" version 2>"$RUNNER_TEMP/npm-view.err")"; then
            if [ "$out" = "$version" ]; then
              echo "::notice title=nothing to publish::$name@$version is on npm already, so this run publishes nothing"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::could not ask npm whether $name@$version is published"
            exit 1
          fi
          echo "$name@$version is not on npm yet"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    # Trusted publishing: npm takes a short-lived OIDC token from this job in
    # place of a token kept in the repository's secrets, and only from a
    # GitHub-hosted runner. Provenance comes with it, since the repository and
    # the package are both public.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # setup-node restores a dependency cache by itself once package.json
          # names npm as its package manager. Nothing here installs anything,
          # and a cache that another run saved has no place in the one job
          # that can publish.
          package-manager-cache: false

      # Below these, npm does not do the OIDC exchange and asks for a token
      # the job does not have. Better said here than as an auth error.
      - name: Node and npm do trusted publishing
        run: |
          node_version="$(node --version)"
          node_version="${node_version#v}"
          npm_version="$(npm --version)"
          at_least() { [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          if ! at_least "$node_version" 22.14.0 || ! at_least "$npm_version" 11.5.1; then
            echo "::error::trusted publishing needs Node 22.14.0 and npm 11.5.1 or later; this job has Node $node_version and npm $npm_version"
            exit 1
          fi
          echo "Node $node_version, npm $npm_version"

      - name: Publish
        run: npm publish
