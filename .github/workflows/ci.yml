name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The plugin runs wherever Open Code does, and the hook handlers spawn
    # processes and touch the filesystem — the two places a platform difference
    # actually shows up. Running one OS would leave that untested, which is the
    # same blind spot `ci-blind-spots` exists to name in somebody else's PR.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # All three block. Windows was `continue-on-error` for four commits, from the
    # run that first showed 96 real failures to the one that showed none, and it
    # is not any more: a job allowed to fail is a job whose result nobody reads,
    # which is the same place this started.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No install step and no cache key: the plugin is zero-dependency by
      # design, and `npm test` is `node --test` over the suite.
      - name: Test
        run: npm test

  plugin-load:
    # Separate from the suite because it answers a different question: not "does
    # the code work" but "will this load as a plugin at all". Every test above
    # passes on a package Open Code refuses to load, and Open Code has no command
    # that validates a plugin. scripts/check-plugin-load.js packs the package,
    # loads the tarball into `opencode serve` and reads the plugin's state back
    # from the server. No model, no secrets.
    #
    # Two Open Code versions. `minimum` is engines.opencode in package.json, the
    # one place the minimum is written: the version a release must load on.
    # `latest` gets no upper bound to respect, since the package declares none,
    # so a failure there says a new Open Code broke something. It is a signal and
    # never blocks.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-blocking for now: this job has never run on a runner, and a gate
          # whose own reliability is unmeasured should not be the thing that
          # stops a merge. Set this to false once it has been green for a few
          # pull requests.
          - opencode: minimum
            signal-only: true
          - opencode: latest
            signal-only: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.signal-only }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: ./.github/actions/install-opencode
        with:
          channel: ${{ matrix.opencode }}

      - name: Load the packed plugin
        run: node scripts/check-plugin-load.js

  receipt-gate-key:
    # The receipt gate's check below runs a model, and the model takes the
    # provider's key from the repository's secrets. A pull request from a fork
    # gets no secrets, nor does a repository that has not set this one: then
    # the check is skipped, shown as skipped, and this job says why. Passing it
    # green without a key would report a check that never ran. A job's `if:`
    # cannot read secrets, hence a job of its own to look.
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.key.outputs.present }}
    steps:
      - id: key
        env:
          KEY: ${{ secrets.PDKIT_SMOKE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo present=false >> "$GITHUB_OUTPUT"
            reason="no PDKIT_SMOKE_KEY secret in this run (pull requests from forks get none), so receipt-gate is skipped: not run, not passed"
            echo "::warning title=receipt-gate skipped::$reason"
            printf '### receipt-gate skipped\n\n%s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  receipt-gate:
    # Does the receipt gate still hold an implementer that stops without a
    # receipt? The gate stands on Open Code's experimental.idle hook, which
    # Open Code calls only after a model step, and which it would accept under
    # a new name without a complaint: renamed, the gate is off and every job
    # above stays green, `pdkit doctor`'s hooks line too. So this one runs a
    # model. scripts/check-receipt-gate.js loads the packed plugin as
    # plugin-load does, has a session start pd-implementer on a task that ends
    # without a receipt, and reads the sessions' records, the journal and
    # `pdkit doctor --json`: held exactly once, then let go with the task
    # accepted once the hold made it capture.
    #
    # The model is a cheap one that can call tools; the key goes to the one
    # step that starts the server, under the name Open Code reads for the
    # provider. Another provider is these two lines and the secret.
    #
    # Both legs are signals for now, as plugin-load's: `latest` always, since a
    # failure there says a new Open Code changed the hook, and `minimum` until
    # a run of green results shows that the model's part of the check is
    # reliable enough to stop a merge on.
    needs: receipt-gate-key
    if: needs.receipt-gate-key.outputs.present == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - opencode: minimum
            signal-only: true
          - opencode: latest
            signal-only: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.signal-only }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: ./.github/actions/install-opencode
        with:
          channel: ${{ matrix.opencode }}

      - name: Hold an implementer without a receipt
        env:
          MODEL: deepseek/deepseek-flash
          DEEPSEEK_API_KEY: ${{ secrets.PDKIT_SMOKE_KEY }}
        run: node scripts/check-receipt-gate.js --model "$MODEL"
