name: Install Open Code
description: >-
  Installs @opencode/cli from npm, at the minimum the package supports
  (engines.opencode) or at latest. Needs Node and the repository checked out.

inputs:
  channel:
    description: "`minimum` (engines.opencode in package.json) or `latest`"
    required: true

runs:
  using: composite
  steps:
    # npm is the install path Open Code documents for CI. The version check
    # makes sure the minimum leg runs the minimum and not some other copy
    # that happens to be on PATH.
    - name: Install Open Code (${{ inputs.channel }})
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        case "$CHANNEL" in
          minimum) version="$(node scripts/check-plugin-load.js --print-minimum)" ;;
          latest) version=latest ;;
          *) echo "::error::channel is minimum or latest, not: $CHANNEL"; exit 1 ;;
        esac
        npm install --global "@opencode/cli@$version"
        installed="$(opencode --version)"
        echo "$installed"
        if [ "$CHANNEL" = minimum ] && [ "$installed" != "opencode v$version" ]; then
          echo "::error::expected opencode v$version, got: $installed"
          exit 1
        fi
